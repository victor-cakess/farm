[project]
name = "farm"
version = "0.1.0"
description = "Local POC showing CEPEA soy price and INMET weather for Brazilian soy farmers"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.4",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "xlrd>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
# The width the code was already written to.
line-length = 92

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package, so the root has to be importable for `src`.
pythonpath = ["."]
